<h1>Inventario</h1>

<div class="filtros">
  <mat-form-field appearance="outline">
    <mat-label>Buscar artículo o código</mat-label>
    <input matInput [formControl]="busqueda" />
  </mat-form-field>
  <mat-chip-option [selected]="soloBajos" (selectionChange)="soloBajos = $event.selected">
    Solo stock bajo
  </mat-chip-option>
</div>

@if (cargando) {
  <app-spinner mensaje="Cargando inventario..."></app-spinner>
} @else {
  <p>{{ articulosFiltrados.length }} artículo(s)</p>
  <app-articulos-tabla [articulos]="articulosFiltrados"></app-articulos-tabla>
}
